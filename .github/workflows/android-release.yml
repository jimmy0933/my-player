name: Android APK · latest release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test, sign, verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android SDK is preinstalled. Avoid setup-android@v3,
      # which currently requests a removed legacy SDK package ("tools").
      - name: Install Android SDK 36
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and run player regression tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Check compact gallery and viewer layout rules
        run: |
          set -euo pipefail
          GALLERY=app/src/main/java/com/jimmy0933/myplayer/GalleryScreen.kt
          VIEWER=app/src/main/java/com/jimmy0933/myplayer/ViewerScreen.kt
          OPERATIONS=app/src/main/java/com/jimmy0933/myplayer/MediaOperations.kt
          grep -Fq 'if (selectionMode)' "$GALLERY"
          grep -Fq 'onLongPress = { onSelect(entry) }' "$GALLERY"
          grep -Fq 'PullToRefreshBox(' "$GALLERY"
          grep -Fq 'progressThicknessDp(size)' "$VIEWER"
          grep -Fq 'bottom = if (isLandscape) 6.dp else 10.dp' "$VIEWER"
          grep -Fq 'touchHeight = if (isLandscape) 80.dp else 104.dp' "$VIEWER"
          grep -Fq 'val actualTargets = remember(destination, entries)' "$GALLERY"
          grep -Fq 'listOf("DCIM", "Movies", "Pictures")' "$OPERATIONS"
          grep -Fq 'Modifier.fillMaxWidth().height(touchHeight)' "$VIEWER"
          if grep -Fq 'progressWidth' "$VIEWER"; then
            echo "ERROR: Timeline width must be fixed to maximum"
            exit 1
          fi
          grep -Fq 'if (media.isVideo) {' "$VIEWER"
          grep -Fq 'onFileAction("移動")' "$GALLERY"
          grep -Fq 'onFileAction("刪除")' "$GALLERY"
          grep -Fq 'onFavoriteSelection()' "$GALLERY"
          if grep -Eq 'PlayerTransportButton|PlayerPlayButton' "$VIEWER"; then
            echo "ERROR: Bottom transport buttons must not block the video"
            exit 1
          fi
          if grep -Fq 'if (selected.isNotEmpty()) {' "$GALLERY"; then
            echo "ERROR: Old sticky selection footer was reintroduced"
            exit 1
          fi
          grep -Fq 'color = Color.White' "$GALLERY"
          grep -Fq 'FolderNavigation.children' "$GALLERY"
          grep -Fq 'FolderNavigation.parent(folder)' "$GALLERY"
          grep -Fq 'readableSize(entry.size)' "$GALLERY"
          grep -Fq 'if (entry.isVideo)' "$GALLERY"
          echo "Video file sizes visible in thumbnail and list modes"
          echo "Folder hierarchy and title contrast checks PASS"
          MANIFEST=app/src/main/AndroidManifest.xml
          EXTERNAL=app/src/main/java/com/jimmy0933/myplayer/ExternalVideoIntents.kt
          MAIN=app/src/main/java/com/jimmy0933/myplayer/MainActivity.kt
          grep -Fq 'android.intent.action.VIEW' "$MANIFEST"
          grep -Fq 'android:scheme="content"' "$MANIFEST"
          grep -Fq 'android:mimeType="video/*"' "$MANIFEST"
          grep -Fq 'ExternalVideoIntents.parse(intent' "$MAIN"
          grep -Fq 'ExternalVideoIntents.asMedia' "$MAIN"
          grep -Fq 'isExternalVideo = openedExternally' "$MAIN"
          grep -Fq 'request.uri' "$EXTERNAL"
          PLAYER_LAYOUT=app/src/main/res/layout/view_player.xml
          grep -Fq 'mediaTransition.AnimatedContent(' "$MAIN"
          grep -Fq 'slideInVertically(' "$MAIN"
          grep -Fq 'slideOutVertically(' "$MAIN"
          grep -Fq 'mediaTransition.isRunning' "$MAIN"
          grep -Fq 'player?.pause()' "$VIEWER"
          grep -Fq 'app:surface_type="texture_view"' "$PLAYER_LAYOUT"
          MATH=app/src/main/java/com/jimmy0933/myplayer/MediaLibrary.kt
          TEST=app/src/test/java/com/jimmy0933/myplayer/PlayerMathTest.kt
          grep -Fq 'PlayerMath.doubleTapSeekSide(' "$VIEWER"
          grep -Fq 'PlayerMath.doubleTapSeekPosition(' "$VIEWER"
          if grep -Eq 'doubleTapHint|doubleTapCount|seekHint' "$VIEWER"; then
            echo "ERROR: Seeking must not cover the video with text overlays"
            exit 1
          fi
          grep -Fq 'fun doubleTapSeekSide(' "$MATH"
          grep -Fq 'fun doubleTapSeekPosition(' "$MATH"
          grep -Fq 'doubleTapSeekZonesAndVideoBounds' "$TEST"
          grep -Fq 'progressHideDelaySeconds = progressHideDelay' "$MAIN"
          grep -Fq 'progress_hide_delay_seconds' "$MAIN"
          grep -Fq 'fun progressHideDelaySeconds(' "$MATH"
          grep -Fq 'listOf(1, 2, 3, 5, 10, 15, 30, 0)' "$MATH"
          grep -Fq 'progressAutoHideDelayOptions' "$TEST"
          grep -Fq 'fun resumePosition(' "$MATH"
          grep -Fq 'playbackResumeAndCompletedVideoRestart' "$TEST"
          grep -Fq 'resumePositionMs = prefs.getLong(' "$MAIN"
          grep -Fq 'gallery_scroll_index' "$GALLERY"
          grep -Fq 'onReturnFocusHandled()' "$GALLERY"
          grep -Fq 'hasBeenPlayed = entry.key in playedVideos' "$GALLERY"
          grep -Fq 'if (entry.isVideo && !hasBeenPlayed && !selectionMode)' "$GALLERY"
          grep -Fq 'Minimal red N in the corner' "$GALLERY"
          grep -Fq 'Color(0xFFE95C66)' "$GALLERY"
          grep -Fq 'columns = GridCells.Fixed(gridColumns)' "$GALLERY"
          grep -Fq 'if (isLandscape) 5 else 3' "$GALLERY"
          grep -Fq 'if (isLandscape) 2 else 1' "$GALLERY"
          grep -Fq 'android:screenOrientation="sensor"' "$MANIFEST"
          grep -Fq 'activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR' "$MAIN"
          if grep -Eq 'rememberInfiniteTransition|\.rotate\(-38f\)' "$GALLERY"; then
            echo "ERROR: Old animated ribbon is still present"
            exit 1
          fi
          grep -Fq 'last_played_video_key' "$MAIN"
          grep -Fq 'lastPlayedVideoKey = lastPlayedVideoKey' "$MAIN"
          grep -Fq 'lastPlayedHoverOnlyHighlightsLatestVideo' "$TEST"
          grep -Fq 'fun isLastPlayedVideo(' "$MATH"
          grep -Fq 'isLastPlayed = PlayerMath.isLastPlayedVideo(' "$GALLERY"
          grep -Fq 'label = "last-played-hover"' "$GALLERY"
          grep -Fq 'stateDescription = "最後播放的影片"' "$GALLERY"
          grep -Fq 'onVideoStarted()' "$VIEWER"
          if grep -Fq '刪除目前檔案' "$VIEWER"; then
            echo "ERROR: Delete must live in the gallery toolbar"
            exit 1
          fi
          grep -Fq 'delay(progressHideDelaySeconds * 1_000L)' "$VIEWER"
          grep -Fq 'if (media.isVideo && controlsVisible)' "$VIEWER"
          grep -Fq 'if (!controlsVisible)' "$VIEWER"
          if grep -Fq 'delay(2_000)' "$VIEWER"; then
            echo "ERROR: The old hard-coded controls timeout was reintroduced"
            exit 1
          fi
          echo "Configurable progress auto-hide and single-tap restore rules PASS"
          echo "Double-tap video seeking and boundary tests PASS"
          echo "Vertical video slide and animatable video surface rules PASS"
          echo "External video intent support and safe playback rules PASS"
          echo "Gallery pull-to-refresh, compact layout and timeline-only viewer rules PASS"

      - name: Prepare signing key from GitHub Actions Secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-player-release.jks"
            echo "MYPLAYER_KEYSTORE_PATH=$RUNNER_TEMP/my-player-release.jks" >> "$GITHUB_ENV"
            echo "MYPLAYER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MYPLAYER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MYPLAYER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Using GitHub Actions signing key."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Actions signing Secrets unavailable in this new repo. Publishing a DEBUG-SIGNED rebuild, NOT upgrade-compatible with old release keys. Add the 4 signing Secrets to enable signed release APKs."
          fi

      - name: Build APK
        run: |
          if [[ "${{ steps.signing.outputs.mode }}" == "release" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Verify and stage APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MODE="${{ steps.signing.outputs.mode }}"
          if [[ "$MODE" == "release" ]]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME=MyPlayer-v1.1.19-signed.apk
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME=MyPlayer-v1.1.19-debug-signed.apk
          fi
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$SRC"
          cp "$SRC" "dist/$NAME"
          sha256sum "dist/$NAME"
          echo "apk=dist/$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish newest release, remove all previous releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.19"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # My Player v1.1.19 · last-played hover highlight

          A gentle animated outline and light lift now show the last played
          video across grid and list views. The selection remains after
          restarting the app, and moves when another video is played.

          Returning from a video preserves the gallery scroll position and
          shows the last viewed item, even after swiping between videos.
          Opening the app again restores the last visited tab, folder and
          precise list/grid scroll offset. Playback resumes from its last
          saved position; videos watched to the end restart from the start.
          Unwatched videos show only a small red N at the top-left of
          their thumbnail, without a background, ribbon or animation.
          The N disappears when playback begins.
          The gallery now rotates into landscape like the video player.
          Thumbnail grids use five landscape columns, and list mode uses two.
          Gallery scrolling and playback state remain preserved across rotations.
          Select videos by long pressing, then
          use the delete button in the gallery top bar. The fullscreen
          viewer no longer includes a delete button.

          Progress bar auto-hide remains configurable at 1, 2, 3, 5
          (default), 10, 15 or 30 seconds, or never hide. The first
          tap when hidden restores controls without pausing playback.
          Edge double-tap seeking and vertical media transitions are preserved.

          Removed the large +10/-10 second text overlays while double
          tapping either edge, and also removed the centered time popup
          during horizontal drag seeking. Videos remain unobstructed while
          seeking; the existing playback timeline still updates normally.
          Left/right double tap still seeks backward/forward 10 seconds.
          Vertical media transitions, zoom and external playback stay intact.

          Swiping up slides the current video off the top while the next
          video enters from the bottom. Swiping down reverses that motion.
          Animations last 360ms, use clipped full-screen frames, and guard
          against repeated swipes mid-transition. A TextureView-based video
          surface makes the actual video frames move with the UI. The outgoing
          player pauses before the next one starts, preventing overlapping audio.

          ## Previous version
          External playback from my-download, direct video URI launch, and
          gallery permission behavior from v1.1.10 remain supported.

          Registered Android ACTION_VIEW video/* handlers for content:// and
          file:// videos, including downloads opened from my-download.
          External video URIs open directly in the player, bypassing gallery
          permission prompts. Back returns to the calling app, and delete/repair
          actions are hidden for files opened through temporary URI grants.
          Added unit tests for supported MIME types and URI schemes.

          Timeline is much easier to grab: the transparent touch target expands
          from 52dp to 104dp in portrait and 80dp in landscape. The progress
          line itself stays at the same visual position and keeps its full-width
          length, adjustable 2–14dp thickness, and opacity settings.
          The settings preview remains compact with a 52dp touch target.

          Raised the full-width playback timeline 36dp above the system navigation
          area (20dp in landscape), with a 52dp touch target. Its rendered track
          remains independently adjustable in thickness and transparency.
          Fixed move/copy failures when videos were sent to restricted Download/
          or other incompatible roots: destinations are placed within allowed
          media directories, and the exact resolved path is shown before approval.
          Added regression coverage for video/photo destination rules.

          The timeline length is always the maximum available screen width,
          with time labels in a separate row. Width controls were removed.
          Only timeline thickness (2-14dp) and transparency are configurable.

          Fixed playback timeline configuration: the progress line now stays visible
          while playback controls fade, track thickness spans 2-14dp, and opacity
          and width update the rendered line. Settings includes live preview and
          intuitive transparency direction. Values persist after restart.

          Pull down at the top of the photo/video list or folder grid to rescan
          the device media library. The native refresh indicator appears above
          existing content without interfering with the viewer's vertical swipe.

          Thumbnail video badges now show only a translucent duration at bottom right;
          file size stays in list view. A brief arrow confirms vertical swipe navigation.
          Move uses Android-authorized MediaStore relocation rather than copy-then-delete;
          a failure dialog shows the actual reason and original files remain safe.
          Timeline opacity and thickness can be adjusted in persistent playback settings.
          Folder navigation: high-contrast folder titles and compact rows; browse immediate
          subfolders from the media root; back goes one level; restart opens at root.
          Content-first redesign: compact gallery tabs, full-size media tiles, long-press selection only,\n          top-right copy/move/delete/favorites, full-screen photo and video, minimal timeline.\n          Restored: gallery, video/photo browsing, search, folders, favorites, configurable playback timeline,
          Media3 1.11.1, pinch zoom, video swipe seek, portrait/landscape controls, selection,
          copy/move via in-app folder picker, Android-authorized deletion, MP4 seek-repair copy.

          Signing mode: **$SIGN_MODE**.
          EOF
          if [[ "$SIGN_MODE" != "release" ]]; then
            printf '\n**Warning:** This APK uses the GitHub Actions debug signing key. It will not update older installs signed with another key. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD Secrets in this repository for stable release signing.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --title "My Player v1.1.19 · rebuilt" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$TAG" dist/*.apk --title "My Player v1.1.19 · rebuilt" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$TAG" ]]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done
          echo "Published newest: $TAG ($SIGN_MODE)"

      - name: Build summary
        if: always()
        run: |
          echo "## My Player Android" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing mode: ${{ steps.signing.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest release: https://github.com/$GITHUB_REPOSITORY/releases/latest" >> "$GITHUB_STEP_SUMMARY"
